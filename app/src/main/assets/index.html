<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Falterflug</title>
<style>
/* Layout: ein Bildschirm, Spielfläche füllt alles, Punktestand oben, Karte unten als Aufkleber. */
:root {
  color-scheme: light;
  --sky: #e3f3e7;
  --meadow: #b4dcc0;
  --paper: #fcfdf6;
  --ink: #1d3a33;
  --wing: #f47a2c;
  --bloom: #e4487b;
  --font-display: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body: "Baloo 2", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--meadow);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: relative; height: 100%; width: 100%; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; padding: 14px 16px; pointer-events: none;
}
.best {
  font-weight: 700; font-size: 16px; line-height: 1.1;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 7px 14px 5px; font-variant-numeric: tabular-nums;
}
.score {
  position: absolute; left: 50%; top: 44px; transform: translateX(-50%);
  font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: 1;
  color: var(--paper); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--ink); font-variant-numeric: tabular-nums;
}
#sound {
  pointer-events: auto; cursor: pointer;
  font: 700 16px/1.1 var(--font-body); color: var(--ink);
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
  padding: 7px 14px 5px;
}
#sound:focus-visible, #go:focus-visible { outline: 3px solid var(--bloom); outline-offset: 3px; }

#hint {
  position: absolute; left: 16px; right: 16px; bottom: 26px; text-align: center;
  font-weight: 700; font-size: 18px; pointer-events: none;
  opacity: 0; transition: opacity .25s;
}
#hint.on { opacity: .85; }

#panel {
  position: absolute; left: 16px; right: 16px; bottom: 28px;
  margin: 0 auto; max-width: 380px;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 22px;
  box-shadow: 0 7px 0 var(--ink);
  padding: 20px 22px 22px; text-align: left;
  display: flex; flex-direction: column; gap: 10px;
  transition: transform .28s cubic-bezier(.3,1.3,.5,1), opacity .2s;
}
#panel.hide { transform: translateY(30px); opacity: 0; pointer-events: none; }
#panel h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800;
  font-size: 40px; line-height: 1; letter-spacing: -.5px; text-wrap: balance;
}
#panel p { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 500; }
#panel .result { font-weight: 700; font-variant-numeric: tabular-nums; }
#go {
  margin-top: 6px; align-self: stretch; cursor: pointer;
  font: 800 22px/1 var(--font-display); color: var(--ink);
  background: var(--wing); border: 3px solid var(--ink); border-radius: 14px;
  padding: 15px 18px 12px; box-shadow: 0 4px 0 var(--ink);
}
#go:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
@media (prefers-reduced-motion: reduce) { #panel, #hint { transition: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Spielfläche: Ein Schmetterling kreist um Blüten"></canvas>
  <div class="hud">
    <div class="best">Rekord <span id="best">0</span></div>
    <button id="sound" type="button" aria-pressed="true">Ton an</button>
  </div>
  <div class="score" id="score" aria-live="polite">0</div>
  <div id="hint">Tippen = losfliegen</div>
  <div id="panel">
    <h1 id="ptitle">Falterflug</h1>
    <p id="ptext">Dein Schmetterling kreist um eine Blüte. Tippe, wenn er auf die nächste Blüte zeigt. Dann fliegt er geradeaus los.</p>
    <p class="result" id="presult" hidden></p>
    <button id="go" type="button">Los geht's</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const elScore = document.getElementById('score');
  const elBest = document.getElementById('best');
  const elPanel = document.getElementById('panel');
  const elTitle = document.getElementById('ptitle');
  const elText = document.getElementById('ptext');
  const elResult = document.getElementById('presult');
  const elGo = document.getElementById('go');
  const elHint = document.getElementById('hint');
  const elSound = document.getElementById('sound');

  const INK = '#1d3a33', PAPER = '#fcfdf6', WING = '#f47a2c';
  const BLOOMS = ['#e4487b', '#7b5bd6', '#f2b422', '#3a9bd9', '#ef6a4b', '#c44fc0'];
  const FLY = 460;            // Fluggeschwindigkeit (Welt-Einheiten pro Sekunde)
  const CATCH = 6;            // Toleranz beim Einfangen
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, S = 1, DPR = 1;
  let t = 0, last = 0;
  let state = 'ready';        // ready | play | over
  let overAt = 0;
  let flowers = [], cur = 0, score = 0, best = 0, camY = 0;
  let parts = [], floats = [];
  const b = { mode: 'orbit', a: -Math.PI / 2, dir: 1, orbR: 48, x: 0, y: 0, vx: 0, vy: 0, heading: 0 };
  const pollen = [];
  for (let i = 0; i < 46; i++) pollen.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.4, d: .2 + Math.random() * .4 });

  /* ---------- Speicher (nur Rekord und Ton, darf fehlen) ---------- */
  function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  let muted = load('falterflug.muted', '0') === '1';

  /* ---------- Ton ---------- */
  let ac = null;
  function initAudio() {
    if (ac || muted) return;
    try { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } catch (e) { ac = null; }
  }
  function tone(freq, dur, type, slideTo) {
    if (muted || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, n);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, n + dur);
      g.gain.setValueAtTime(.0001, n);
      g.gain.exponentialRampToValueAtTime(.14, n + .015);
      g.gain.exponentialRampToValueAtTime(.0001, n + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(n); o.stop(n + dur + .02);
    } catch (e) {}
  }
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  function noteFor(n) { return 392 * Math.pow(2, SCALE[n % SCALE.length] / 12); }
  function showSound() {
    elSound.textContent = muted ? 'Ton aus' : 'Ton an';
    elSound.setAttribute('aria-pressed', muted ? 'false' : 'true');
  }

  /* ---------- Welt ---------- */
  const rand = (a, c) => a + Math.random() * (c - a);
  function speed(i) { return 108 + Math.min(i, 45) * 3.2; }
  function fx(f) { return f.x0 + Math.sin(t * .9 + f.phase) * f.amp; }
  function makeFlower(i, prev) {
    const r = Math.max(30, 48 - i * .5);
    const amp = i >= 12 ? Math.min(45, (i - 11) * 4) : 0;
    let x0 = 200, y = 0;
    if (prev) {
      y = prev.y - rand(165, 215) - Math.min(i, 30) * 1.2;
      const lo = 70 + amp, hi = 330 - amp;
      for (let k = 0; k < 8; k++) { x0 = rand(lo, hi); if (Math.abs(x0 - prev.x0) > 35) break; }
    }
    return { x0, y, r, amp, phase: rand(0, 6.28), pet: 5 + (i * 3) % 4, color: BLOOMS[i % BLOOMS.length], spin: rand(-.25, .25) };
  }
  function extend() {
    while (flowers.length < cur + 7) flowers.push(makeFlower(flowers.length, flowers[flowers.length - 1]));
  }
  function reset() {
    flowers = []; cur = 0; score = 0; parts = []; floats = [];
    extend();
    camY = flowers[0].y;
    b.mode = 'orbit'; b.a = Math.PI * .75; b.dir = 1; b.orbR = flowers[0].r;
    elScore.textContent = '0';
  }

  function sx(x) { return (x - 200) * S + W / 2; }
  function sy(y) { return (y - camY) * S + H * .66; }

  function release() {
    b.mode = 'fly';
    b.vx = Math.cos(b.heading) * FLY;
    b.vy = Math.sin(b.heading) * FLY;
    tone(660, .09, 'sine', 880);
    elHint.classList.remove('on');
  }

  function capture(i, d) {
    const f = flowers[i], cx = fx(f);
    const hx = b.vx / FLY, hy = b.vy / FLY;
    const off = Math.abs((cx - b.x) * hy - (f.y - b.y) * hx);
    const perfect = off < f.r * .3;
    const gained = (i - cur) + (perfect ? 1 : 0);
    score += gained;
    elScore.textContent = String(score);
    const cross = (b.x - cx) * b.vy - (b.y - f.y) * b.vx;
    b.dir = cross >= 0 ? 1 : -1;
    b.a = Math.atan2(b.y - f.y, b.x - cx);
    b.orbR = d;
    b.mode = 'orbit';
    cur = i;
    extend();
    if (perfect) floats.push({ x: cx, y: f.y - f.r - 14, text: 'Volltreffer +1', life: 1 });
    if (!calm) for (let k = 0; k < 14; k++) {
      const a = rand(0, 6.28), v = rand(40, 150);
      parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, c: f.color, r: rand(2, 4.5) });
    }
    tone(noteFor(cur), .22, 'triangle');
    if (perfect) setTimeout(() => tone(noteFor(cur) * 1.5, .2, 'triangle'), 90);
  }

  function gameOver() {
    state = 'over'; overAt = performance.now(); b.mode = 'lost';
    const record = score > best;
    if (record) { best = score; save('falterflug.best', String(best)); elBest.textContent = String(best); }
    tone(300, .45, 'sawtooth', 110);
    elTitle.textContent = record ? 'Neuer Rekord!' : 'Verflogen!';
    elText.textContent = record
      ? 'So weit ist dein Schmetterling noch nie gekommen.'
      : 'Der Schmetterling hat die Blüte verfehlt. Tippe etwas früher oder später.';
    elResult.hidden = false;
    elResult.textContent = 'Punkte ' + score + ' · Rekord ' + best;
    elGo.textContent = 'Nochmal';
    elPanel.classList.remove('hide');
  }

  function act() {
    if (state === 'ready') {
      initAudio(); state = 'play'; elPanel.classList.add('hide'); elHint.classList.add('on');
    } else if (state === 'play') {
      if (b.mode === 'orbit') release();
    } else if (state === 'over' && performance.now() - overAt > 450) {
      reset(); state = 'play'; elPanel.classList.add('hide');
    }
  }

  /* ---------- Ablauf ---------- */
  function update(dt) {
    t += dt;
    if (b.mode === 'orbit') {
      const f = flowers[cur];
      b.a += b.dir * (speed(cur) / f.r) * dt;
      b.orbR += (f.r - b.orbR) * Math.min(1, dt * 10);
      b.x = fx(f) + Math.cos(b.a) * b.orbR;
      b.y = f.y + Math.sin(b.a) * b.orbR;
      b.heading = b.a + b.dir * Math.PI / 2;
    } else if (b.mode === 'fly') {
      const steps = 3, h = dt / steps;
      outer:
      for (let s = 0; s < steps; s++) {
        b.x += b.vx * h; b.y += b.vy * h;
        for (let i = cur + 1; i < flowers.length; i++) {
          const f = flowers[i], d = Math.hypot(b.x - fx(f), b.y - f.y);
          if (d <= f.r + CATCH) { capture(i, d); break outer; }
        }
      }
      if (b.mode === 'fly') {
        if (!calm && Math.random() < .6) parts.push({ x: b.x, y: b.y, vx: rand(-15, 15), vy: rand(-15, 15), life: .6, c: PAPER, r: rand(1.5, 3) });
        const px = sx(b.x), py = sy(b.y);
        if (px < -40 || px > W + 40 || py < -40 || py > H + 40) gameOver();
      }
    }
    camY += (flowers[cur].y - camY) * Math.min(1, dt * 5);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt * 1.6; }
    parts = parts.filter(p => p.life > 0);
    for (const fl of floats) { fl.y -= 26 * dt; fl.life -= dt * .9; }
    floats = floats.filter(fl => fl.life > 0);
  }

  /* ---------- Zeichnen ---------- */
  function drawFlower(f, i) {
    const x = sx(fx(f)), y = sy(f.y);
    if (y < -120 * S || y > H + 120 * S) return;
    ctx.save();
    ctx.translate(x, y); ctx.scale(S, S);
    const past = i < cur, isCur = i === cur, isNext = i === cur + 1;
    ctx.globalAlpha = past ? .3 : 1;
    if (isNext && state !== 'over') {
      ctx.fillStyle = 'rgba(252,253,246,' + (.35 + .2 * Math.sin(t * 5)) + ')';
      ctx.beginPath(); ctx.arc(0, 0, f.r + 9, 0, 6.2832); ctx.fill();
    }
    ctx.strokeStyle = INK; ctx.lineWidth = isCur ? 2.4 : 1.8;
    ctx.setLineDash([5, 6]); ctx.lineDashOffset = -t * 10;
    ctx.globalAlpha *= isCur ? .8 : .45;
    ctx.beginPath(); ctx.arc(0, 0, f.r, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = past ? .3 : 1;
    ctx.rotate(t * f.spin + f.phase);
    ctx.fillStyle = f.color; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    for (let k = 0; k < f.pet; k++) {
      ctx.rotate(6.2832 / f.pet);
      ctx.beginPath(); ctx.ellipse(f.r * .4, 0, f.r * .3, f.r * .17, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#ffd85a';
    ctx.beginPath(); ctx.arc(0, 0, f.r * .2, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawButterfly() {
    if (b.mode === 'lost') return;
    ctx.save();
    ctx.translate(sx(b.x), sy(b.y));
    ctx.rotate(b.heading);
    const k = S * 1.3; ctx.scale(k, k);
    const flap = calm ? .9 : .3 + .7 * Math.abs(Math.sin(t * (b.mode === 'fly' ? 22 : 13)));
    ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
    for (const side of [-1, 1]) {
      ctx.save(); ctx.scale(1, side * flap);
      ctx.fillStyle = '#ffb347';
      ctx.beginPath(); ctx.moveTo(1, 1);
      ctx.bezierCurveTo(-2, 14, -16, 18, -14, 8);
      ctx.bezierCurveTo(-13, 3, -5, 1, 1, 1);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = WING;
      ctx.beginPath(); ctx.moveTo(3, 1);
      ctx.bezierCurveTo(16, 3, 19, 22, 5, 21);
      ctx.bezierCurveTo(-3, 17, -1, 6, 3, 1);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = PAPER;
      ctx.beginPath(); ctx.arc(9, 14, 2.2, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(-9, 9, 1.6, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.quadraticCurveTo(12, -2, 14, -6);
    ctx.moveTo(8, 0); ctx.quadraticCurveTo(12, 2, 14, 6); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 2.4, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#e3f3e7'); g.addColorStop(1, '#b4dcc0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(252,253,246,.75)';
    for (const p of pollen) {
      const drift = calm ? 0 : Math.sin(t * .4 + p.x * 20) * 8;
      const yy = (((p.y * (H + 40) - camY * S * p.d) % (H + 40)) + (H + 40)) % (H + 40) - 20;
      ctx.beginPath(); ctx.arc(p.x * W + drift, yy, p.r, 0, 6.2832); ctx.fill();
    }

    for (let i = Math.max(0, cur - 3); i < flowers.length; i++) drawFlower(flowers[i], i);

    // Ziellinie: am Anfang lang, später nur noch ein kurzer Fühler
    if (b.mode === 'orbit' && state !== 'over') {
      const len = (score < 5 ? 420 : 70) * S;
      const x0 = sx(b.x), y0 = sy(b.y);
      ctx.save();
      ctx.strokeStyle = INK; ctx.globalAlpha = score < 5 ? .32 : .22;
      ctx.lineWidth = 2; ctx.setLineDash([3, 9]); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, y0);
      ctx.lineTo(x0 + Math.cos(b.heading) * len, y0 + Math.sin(b.heading) * len);
      ctx.stroke(); ctx.restore();
    }

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.r * S, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawButterfly();

    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.round(20 * S) + 'px "Baloo 2", "Trebuchet MS", system-ui, sans-serif';
    for (const fl of floats) {
      ctx.globalAlpha = Math.min(1, fl.life * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = PAPER; ctx.fillStyle = INK;
      const x = Math.min(W - 80, Math.max(80, sx(fl.x)));
      ctx.strokeText(fl.text, x, sy(fl.y)); ctx.fillText(fl.text, x, sy(fl.y));
    }
    ctx.globalAlpha = 1;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    S = Math.min(W / 400, H / 700);
  }

  function frame(now) {
    const dt = Math.min(.034, (now - last) / 1000 || 0);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  /* ---------- Eingaben ---------- */
  document.addEventListener('pointerdown', (e) => {
    if (e.target === elSound) return;
    e.preventDefault(); act();
  }, { passive: false });
  document.addEventListener('keydown', (e) => {
    if (e.target === elSound) return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) act(); }
  });
  elGo.addEventListener('click', (e) => { if (e.detail === 0) act(); });
  elSound.addEventListener('click', () => {
    muted = !muted; save('falterflug.muted', muted ? '1' : '0'); showSound();
    if (!muted) { initAudio(); tone(523, .12, 'triangle'); }
  });
  window.addEventListener('resize', resize);

  /* ---------- Start ---------- */
  function start(data) {
    best = Math.max(parseInt(load('falterflug.best', '0'), 10) || 0, (data && data.best) || 0);
    elBest.textContent = String(best);
    showSound(); resize(); reset();
    last = performance.now();
    requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ best }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
